<title>후쿠오카 가족여행</title>
<style>
:root{--g:#d4af37;--g2:#f3dfa2;--ink:#efe6d4;--mute:#9b9180}
html,body{margin:0;height:100%;background:#070605;color:var(--ink);-webkit-font-smoothing:antialiased;
 font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif}
body{background:radial-gradient(120% 80% at 50% 0%,#1d1710 0%,#070605 60%)}
.box{min-height:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{width:100%;max-width:360px;text-align:center;padding:40px 28px 30px;border:1px solid rgba(212,175,55,.28);
 border-radius:18px;background:linear-gradient(160deg,rgba(32,27,21,.92),rgba(14,12,10,.94));
 box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(243,223,162,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.k{font-size:10.5px;letter-spacing:.5em;color:var(--g);margin:0 0 14px;font-weight:600}
h1{font-size:25px;margin:0 0 8px;font-weight:700;letter-spacing:-.01em;
 background:linear-gradient(180deg,#fff3cf,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.line{width:42px;height:1px;margin:0 auto 16px;background:linear-gradient(90deg,transparent,var(--g),transparent)}
p{font-size:13px;line-height:1.6;color:var(--mute);margin:0 0 22px}
#pw{width:100%;box-sizing:border-box;padding:14px 16px;font-size:18px;letter-spacing:.28em;border-radius:12px;
 border:1px solid rgba(212,175,55,.32);background:rgba(0,0,0,.35);color:var(--ink);outline:none;text-align:center;
 font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
#pw:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(212,175,55,.12)}
#pw::placeholder{letter-spacing:.05em;color:#5f574b;font-family:inherit;font-size:15px}
button{width:100%;margin-top:12px;padding:14px;font-size:15px;font-weight:700;border:0;border-radius:12px;letter-spacing:.08em;
 background:linear-gradient(150deg,var(--g2),var(--g));color:#17130a;cursor:pointer;transition:transform .12s,filter .2s;-webkit-appearance:none}
button:hover{filter:brightness(1.06)}button:active{transform:scale(.985)}button:disabled{opacity:.7}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:#7d7466;margin-top:16px;cursor:pointer}
label input{accent-color:var(--g)}
.hint{font-size:11.5px;color:#8a7f6c;min-height:16px;margin-top:9px}
.err{color:#f0a79c;font-size:12.5px;min-height:18px;margin-top:6px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

<div class="box"><form class="card" id="f" autocomplete="off">
 <p class="k">FUKUOKA · 2026</p>
 <h1>후쿠오카 가족여행</h1>
 <div class="line"></div>
 <p>가족만 볼 수 있는 페이지입니다.<br>암호를 입력해 주세요.</p>
 <input type="text" id="pw" placeholder="암호 (영문)" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en" inputmode="latin" enterkeyhint="go">
 <div class="hint" id="hint"></div>
 <button type="submit" id="go">열기</button>
 <label><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
 <div class="err" id="err"></div>
</form></div>
<script>
/* 암호 입력: 영문만 · 방금 친 글자만 1초 보이고 나머지는 ● · 한/영 상태여도 키 자리대로 영문 */
var PW='',peek=null,pwEl=document.getElementById('pw'),hintEl=document.getElementById('hint');
var SH={Digit1:'!',Digit2:'@',Digit3:'#',Digit4:'$',Digit5:'%',Digit6:'^',Digit7:'&',Digit8:'*',Digit9:'(',Digit0:')',
 Minus:'_',Equal:'+',BracketLeft:'{',BracketRight:'}',Backslash:'|',Semicolon:':',Quote:'"',Comma:'<',Period:'>',Slash:'?',Backquote:'~'};
var NS={Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Backslash:'\x5c',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backquote:'`'};
function paint(showLast){
  var n=PW.length; pwEl.value=n?(new Array(n).join('●')+(showLast?PW[n-1]:'●')):'';
  try{pwEl.setSelectionRange(pwEl.value.length,pwEl.value.length);}catch(e){}
  clearTimeout(peek); if(showLast) peek=setTimeout(function(){paint(false);},1000);
}
function fromCode(e){
  var c=e.code||'',s=e.shiftKey;
  if(/^Key[A-Z]$/.test(c)){var ch=c.slice(3); var up=s!==(e.getModifierState&&e.getModifierState('CapsLock')); return up?ch:ch.toLowerCase();}
  if(/^Digit\d$/.test(c)) return s?SH[c]:c.slice(5);
  if(NS[c]) return s?SH[c]:NS[c];
  if(c==='Space') return '';
  return null;
}
pwEl.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Enter') return;
  if(e.key==='Backspace'){e.preventDefault();PW=PW.slice(0,-1);paint(false);return;}
  var ch=fromCode(e);
  if(ch!==null&&e.code){e.preventDefault();if(ch){PW+=ch;paint(true);}
    hintEl.textContent=/[^\x00-\x7f]/.test(e.key||'')?'한글 자판이어도 영문으로 입력됩니다':'';}
});
pwEl.addEventListener('input',function(){           /* 휴대폰 자판 · 붙여넣기 */
  var v=pwEl.value,shown=PW.length;
  if(v.length<shown){PW=PW.slice(0,v.length);paint(false);return;}
  var add=v.slice(shown).replace(/●/g,''),ok=add.replace(/[^\x21-\x7e]/g,'');
  hintEl.textContent=ok.length<add.length?'영문·숫자만 입력됩니다 (한/영 전환)':'';
  PW+=ok; paint(ok.length>0);
});
pwEl.addEventListener('compositionend',function(){var v=pwEl.value;pwEl.value=v.replace(/[^\x00-\x7f●]/g,'');paint(false);});
</script>

function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function norm(x){return (x||'').normalize('NFC').replace(/\s+/g,'');}
function b64(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
async function keyFromPw(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,256));
}
async function openWith(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  return new TextDecoder().decode(pt);
}
async function show(raw,remember){
  var html=await openWith(raw);
  var k=b64(raw);
  try{ sessionStorage.setItem('fk_k',k); sessionStorage.removeItem('fk_pw_s'); }catch(e){}
  try{ localStorage.removeItem('fk_pw'); if(remember) localStorage.setItem('fk_k',k); else localStorage.removeItem('fk_k'); }catch(e){}
  document.open(); document.write(html); document.close();
}
async function tryOpen(pw,remember){
  try{ await show(await keyFromPw(pw),remember); return true; }catch(e){ return false; }
}
document.getElementById('f').onsubmit=async function(e){
  e.preventDefault();
  var b=document.getElementById('go'); b.disabled=true; b.textContent='여는 중...';
  var ok=await tryOpen(PW, document.getElementById('rem').checked);
  if(!ok){ document.getElementById('err').textContent='암호가 맞지 않습니다'; var c=document.getElementById('f'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); PW=''; paint(false); b.disabled=false; b.textContent='열기';
    await new Promise(function(r){setTimeout(r,1200);}); }
};
(async function(){
  try{
    var old=localStorage.getItem('fk_pw');           /* 예전 방식(암호 글자 저장)은 키로 바꿔 두고 지운다 */
    if(old){ localStorage.removeItem('fk_pw'); if(await tryOpen(old,true)) return; }
    var k=localStorage.getItem('fk_k')||sessionStorage.getItem('fk_k');
    if(k){ try{ await show(u8(k), !!localStorage.getItem('fk_k')); }catch(e){ localStorage.removeItem('fk_k'); sessionStorage.removeItem('fk_k'); } }
  }catch(e){}
})();
